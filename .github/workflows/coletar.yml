# Coleta os dados do Home Office Life e publica os arquivos atualizados.
# - oportunidades.json (anúncios reais de trabalho): todo dia
# - custos.json (custos de vida das capitais): também roda todo dia, mas as fontes só mudam uma vez por mês
name: Coletar dados

on:
  schedule:
    - cron: '0 11 * * *'       # todo dia, às 11h UTC (8h em Brasília)
  workflow_dispatch:           # também dá para rodar à mão na aba Actions

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Custos das capitais
        run: python coletor/coletar.py
      - name: Anúncios reais de trabalho
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python coletor/oportunidades.py
      - name: Guardar os arquivos novos (se mudaram)
        run: |
          if git diff --quiet custos.json oportunidades.json; then
            echo "Nada mudou."
          else
            git config user.name "coletor-automatico"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custos.json oportunidades.json
            git commit -m "Coleta automática ($(date +%Y-%m-%d))"
            git push
          fi
