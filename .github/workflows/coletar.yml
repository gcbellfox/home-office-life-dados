# Coleta os custos de vida das capitais uma vez por mês e publica o custos.json atualizado.
name: Coletar custos

on:
  schedule:
    - cron: '0 12 5 * *'      # todo dia 5, às 12h UTC (9h em Brasília)
  workflow_dispatch:           # também dá para rodar à mão na aba Actions

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rodar o coletor
        run: python coletor/coletar.py
      - name: Guardar o arquivo novo (se mudou)
        run: |
          if git diff --quiet custos.json; then
            echo "Nada mudou."
          else
            git config user.name "coletor-automatico"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custos.json
            git commit -m "Coleta mensal de custos ($(date +%Y-%m-%d))"
            git push
          fi
